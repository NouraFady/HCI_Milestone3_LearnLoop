t_ocr(d){return reviewWrap(d,'t_ocr',()=>{const{st,s}=d;

 return `<div class="card" style="padding:8px 8px 12px"><div class="tw"><table class="tbl" style="min-width:860px"><thead><tr><th>Q</th><th>${_('Question · model answer · student answer')}</th><th>${_('AI mark')}</th><th>${_('Your mark')}</th><th>${_('Feedback')}</th></tr></thead><tbody>

t_practice(d){return reviewWrap(d,'t_practice',()=>{const{st,s}=d;const L=S.lang;if(st<5)return note(_('Practice is drafted after you confirm a learning gap.'));
